    :root { --accent: #FFC300; }
    * { box-sizing: border-box; }

    body {

    .back {

      font-size: 13px; transition: color 0.15s ease;
    }
    .back:hover { color: var(--accent); }

    .lang-switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
    .lang-btn {

      font-family: 'Rajdhani', sans-serif; font-weight: 700;
      font-size: 12px; padding: 5px 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;

    .lang-btn.active { border-color: var(--accent); color: var(--accent); }

    .updated { color: #737373; font-size: 13px; margin-bottom: 32px; }

    .section-card {
      background: #0F0F0F;
      border: 1px solid #262626;

      padding: 18px 20px;
      margin-bottom: 14px;

      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      text-transform: uppercase;

    .section-card p { color: #d4d4d4; font-size: 14.5px; margin: 0; }

      body { padding: 28px 16px 64px; }

    const LANGS = ['en', 'fr', 'de', 'es', 'it', 'pt'];

    function getLang() {
      const params = new URLSearchParams(window.location.search);
      const l = params.get('lang');
      return LANGS.includes(l) ? l : 'en';
    }

    function render(lang) {
      const c = CONTENT[lang];
      document.getElementById('pageTitle').textContent = c.title + ' — Scope';
      document.getElementById('title').textContent = c.title;
      document.getElementById('updated').textContent = c.updated;
      document.getElementById('backLink').textContent = c.back;
      document.documentElement.lang = lang;

      const container = document.getElementById('sections');
      container.innerHTML = '';
      c.sections.forEach((s) => {
        const card = document.createElement('div');
        card.className = 'section-card';
        const h2 = document.createElement('h2');
        h2.textContent = s.h;
        const p = document.createElement('p');
        p.innerHTML = s.p;
        card.appendChild(h2);
        card.appendChild(p);
        container.appendChild(card);
      });

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      const url = new URL(window.location);
      url.searchParams.set('lang', lang);
      window.history.replaceState({}, '', url);
    }

    function buildSwitcher() {
      const el = document.getElementById('langSwitch');
      LANGS.forEach((l) => {
        const btn = document.createElement('button');
        btn.className = 'lang-btn';
        btn.dataset.lang = l;
        btn.textContent = l.toUpperCase();
        btn.onclick = () => render(l);
        el.appendChild(btn);
      });
    }

    buildSwitcher();
    render(getLang());
