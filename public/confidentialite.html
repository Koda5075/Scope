<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Privacy Policy — Scope</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap');

    :root { --accent: #FFC300; }
    * { box-sizing: border-box; }

    body {
      background: #000;
      color: #e5e5e5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 80px;
      line-height: 1.6;
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-logo { width: 36px; height: 36px; object-fit: contain; }
    .brand-name { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.04em; color: #fff; }
    .brand-rule { height: 2px; width: 44px; background: var(--accent); margin-top: 4px; }

    .back {
      display: inline-block; margin-bottom: 20px; color: #737373; text-decoration: none;
      font-size: 13px; transition: color 0.15s ease;
    }
    .back:hover { color: var(--accent); }

    .lang-switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
    .lang-btn {
      background: #0F0F0F; border: 1px solid #262626; color: #737373;
      font-family: 'Rajdhani', sans-serif; font-weight: 700;
      font-size: 12px; padding: 5px 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .lang-btn:hover { color: #d4d4d4; }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); }

    h1 { font-family: 'Rajdhani', sans-serif; font-weight: 700; color: #fff; font-size: 30px; margin: 0 0 4px; letter-spacing: 0.01em; }
    .updated { color: #737373; font-size: 13px; margin-bottom: 32px; }

    .section-card {
      background: #0F0F0F;
      border: 1px solid #262626;
      border-left: 3px solid var(--accent);
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .section-card h2 {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      font-size: 15px;
      margin: 0 0 10px;
    }
    .section-card p { color: #d4d4d4; font-size: 14.5px; margin: 0; }
    .section-card a { color: var(--accent); }

    @media (max-width: 480px) {
      body { padding: 28px 16px 64px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="/logo.png" alt="Scope" class="brand-logo" />
    <div>
      <span class="brand-name">SCOPE</span>
      <div class="brand-rule"></div>
    </div>
  </div>

  <a href="/" class="back" id="backLink">← Back to Scope</a>
  <div class="lang-switch" id="langSwitch"></div>
  <h1 id="title"></h1>
  <div class="updated" id="updated"></div>
  <div id="sections"></div>

  <script>
    const CONTENT = {
      en: {
        title: "Privacy Policy",
        updated: "Last updated: to be completed before publishing",
        back: "← Back to Scope",
        sections: [
          { h: "1. Data collected", p: "When a player links their account via RSO (Riot Sign-On), Scope accesses the following data, made available through the official Riot Games API: Riot ID (Name#Tag), competitive rank, match history, performance statistics (K/D, accuracy, agents played, maps played)." },
          { h: "2. Purpose of processing", p: "This data is used solely to display statistics and, for premium subscribers, to generate personalized analysis tips. It is never sold to third parties." },
          { h: "3. Legal basis", p: "Processing is based on the user's explicit consent, given at the time of connection via RSO. This consent can be withdrawn at any time by unlinking the Riot account in settings, or by contacting support." },
          { h: "4. Data retention", p: "Data is retained as long as the user account is active. If the account is deleted, associated data is deleted within 30 days." },
          { h: "5. Sharing with third parties", p: "Scope uses technical providers to operate: hosting (Vercel), database (Supabase), payment (Stripe). These providers only have access to the data strictly necessary for their function and do not use it for other purposes." },
          { h: "6. User rights (GDPR)", p: "In accordance with GDPR, any user can request access, correction, or deletion of their data, as well as data portability, by writing to the address below. Account deletion can also be triggered directly from the app, via Settings → \"Delete my account\"." },
          { h: "7. Contact", p: "For any question regarding this policy or to exercise your rights: <a href=\"mailto:contact@exemple.com\">contact@exemple.com</a> (address to be replaced)" },
        ],
      },
      fr: {

          { h: "6. Droits de l'utilisateur (RGPD)", p: "Conformément au RGPD, tout utilisateur peut demander l'accès, la rectification ou la suppression de ses données, ainsi que la portabilité de celles-ci, en écrivant à l'adresse ci-dessous. La suppression du compte peut aussi être déclenchée directement depuis l'application, via les Réglages → « Supprimer mon compte »." },
          { h: "7. Contact", p: "Pour toute question relative à cette politique ou pour exercer vos droits : <a href=\"mailto:contact@exemple.com\">contact@exemple.com</a> (adresse à remplacer)" },
        ],

        ],

      es: {
        title: "Política de Privacidad",
        updated: "Última actualización: por completar antes de la publicación",

          { h: "2. Finalidad del tratamiento", p: "Estos datos se utilizan únicamente para mostrar estadísticas y, para los suscriptores premium, para generar consejos de análisis personalizados. Nunca se venden a terceros." },
          { h: "3. Base legal", p: "El tratamiento se basa en el consentimiento explícito del usuario, otorgado al conectar mediante RSO. Este consentimiento puede retirarse en cualquier momento desvinculando la cuenta de Riot en los ajustes, o contactando con soporte." },
          { h: "4. Conservación de los datos", p: "Los datos se conservan mientras la cuenta del usuario esté activa. Si se elimina la cuenta, los datos asociados se eliminan en un plazo de 30 días." },
          { h: "5. Compartición con terceros", p: "Scope utiliza proveedores técnicos para funcionar: alojamiento (Vercel), base de datos (Supabase), pago (Stripe). Estos proveedores solo tienen acceso a los datos estrictamente necesarios para su función y no los utilizan para otros fines." },
          { h: "6. Derechos del usuario (RGPD)", p: "De acuerdo con el RGPD, cualquier usuario puede solicitar el acceso, rectificación o eliminación de sus datos, así como la portabilidad de los mismos, escribiendo a la dirección indicada. La eliminación de la cuenta también se puede iniciar directamente desde la aplicación, en Ajustes → «Eliminar mi cuenta»." },
          { h: "7. Contacto", p: "Para cualquier pregunta sobre esta política o para ejercer tus derechos: <a href=\"mailto:contact@exemple.com\">contact@exemple.com</a> (dirección a sustituir)" },

      },
      it: {
        title: "Informativa sulla Privacy",
        updated: "Ultimo aggiornamento: da completare prima della pubblicazione",
        back: "← Torna a Scope",
        sections: [
          { h: "1. Dati raccolti", p: "Quando un giocatore collega il proprio account tramite RSO (Riot Sign-On), Scope accede ai seguenti dati, resi disponibili tramite l'API ufficiale di Riot Games: Riot ID (Nome#Tag), rango competitivo, cronologia partite, statistiche di prestazione (K/D, precisione, agenti giocati, mappe giocate)." },
          { h: "2. Finalità del trattamento", p: "Questi dati sono utilizzati esclusivamente per mostrare le statistiche e, per gli abbonati premium, per generare consigli di analisi personalizzati. Non vengono mai venduti a terzi." },
          { h: "3. Base giuridica", p: "Il trattamento si basa sul consenso esplicito dell'utente, fornito al momento della connessione tramite RSO. Questo consenso può essere revocato in qualsiasi momento scollegando l'account Riot dalle impostazioni, o contattando l'assistenza." },
          { h: "4. Conservazione dei dati", p: "I dati vengono conservati finché l'account utente è attivo. In caso di eliminazione dell'account, i dati associati vengono eliminati entro 30 giorni." },
          { h: "5. Condivisione con terzi", p: "Scope utilizza fornitori tecnici per funzionare: hosting (Vercel), database (Supabase), pagamento (Stripe). Questi fornitori hanno accesso solo ai dati strettamente necessari alla loro funzione e non li utilizzano per altri scopi." },
          { h: "6. Diritti dell'utente (GDPR)", p: "In conformità al GDPR, ogni utente può richiedere l'accesso, la rettifica o la cancellazione dei propri dati, nonché la loro portabilità, scrivendo all'indirizzo sottostante. L'eliminazione dell'account può anche essere avviata direttamente dall'app, in Impostazioni → «Elimina il mio account»." },

          { h: "2. Finalidade do tratamento", p: "Estes dados são utilizados exclusivamente para apresentar estatísticas e, para os subscritores premium, para gerar sugestões de análise personalizadas. Nunca são vendidos a terceiros." },
          { h: "3. Base legal", p: "O tratamento baseia-se no consentimento explícito do utilizador, dado no momento da ligação via RSO. Este consentimento pode ser retirado a qualquer momento, desligando a conta Riot nas definições, ou contactando o suporte." },

          { h: "6. Direitos do utilizador (RGPD)", p: "Em conformidade com o RGPD, qualquer utilizador pode solicitar o acesso, retificação ou eliminação dos seus dados, bem como a sua portabilidade, escrevendo para o endereço abaixo. A eliminação da conta também pode ser iniciada diretamente na aplicação, em Definições → «Eliminar a minha conta»." },

        ],
      },
    };

    const LANGS = ['en', 'fr', 'de', 'es', 'it', 'pt'];

    function getLang() {
      const params = new URLSearchParams(window.location.search);
      const l = params.get('lang');
      return LANGS.includes(l) ? l : 'en';
    }

    function render(lang) {
      const c = CONTENT[lang];
      document.getElementById('pageTitle').textContent = c.title + ' — Scope';
      document.getElementById('title').textContent = c.title;
      document.getElementById('updated').textContent = c.updated;
      document.getElementById('backLink').textContent = c.back;
      document.documentElement.lang = lang;

      const container = document.getElementById('sections');
      container.innerHTML = '';
      c.sections.forEach((s) => {
        const card = document.createElement('div');
        card.className = 'section-card';
        const h2 = document.createElement('h2');
        h2.textContent = s.h;
        const p = document.createElement('p');
        p.innerHTML = s.p;
        card.appendChild(h2);
        card.appendChild(p);
        container.appendChild(card);
      });

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      const url = new URL(window.location);
      url.searchParams.set('lang', lang);
      window.history.replaceState({}, '', url);
    }

    function buildSwitcher() {
      const el = document.getElementById('langSwitch');
      LANGS.forEach((l) => {
        const btn = document.createElement('button');
        btn.className = 'lang-btn';
        btn.dataset.lang = l;
        btn.textContent = l.toUpperCase();
        btn.onclick = () => render(l);
        el.appendChild(btn);
      });
    }

    buildSwitcher();
    render(getLang());
  </script>
</body>
</html>
