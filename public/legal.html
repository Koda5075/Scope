    const LANGS = ['en', 'fr', 'de', 'es', 'it', 'pt'];

    function getLang() {
      const params = new URLSearchParams(window.location.search);
      const l = params.get('lang');
      return LANGS.includes(l) ? l : 'en';
    }

    function renderGroup(sections, prefix, containerId, tocId) {
      const container = document.getElementById(containerId);
      const toc = document.getElementById(tocId);
      container.innerHTML = '';
      toc.innerHTML = '';
      sections.forEach((s, i) => {
        const id = prefix + '-' + (i + 1);

        const card = document.createElement('div');
        card.className = 'section-card';
        card.id = id;
        const h3 = document.createElement('h3');
        h3.textContent = s.h;
        const p = document.createElement('p');
        p.innerHTML = s.p;
        card.appendChild(h3);
        card.appendChild(p);
        container.appendChild(card);

        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = s.h;
        li.appendChild(a);
        toc.appendChild(li);
      });
    }

    function render(lang) {
      const c = CONTENT[lang];
      document.getElementById('pageTitle').textContent = c.docTitle + ' — Scope';
      document.getElementById('title').textContent = c.docTitle;
      document.getElementById('updated').textContent = c.updated;
      document.getElementById('backLink').textContent = c.back;
      document.getElementById('tocLabel').textContent = c.tocLabel;
      document.getElementById('tocCguLink').textContent = c.cguTitle;
      document.getElementById('tocPrivLink').textContent = c.privTitle;
      document.getElementById('cgu').textContent = c.cguTitle;
      document.getElementById('confidentialite').textContent = c.privTitle;
      document.documentElement.lang = lang;

      renderGroup(c.cgu, 'cgu', 'cguSections', 'tocCgu');
      renderGroup(c.priv, 'priv', 'privSections', 'tocPriv');

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      const url = new URL(window.location);
      url.searchParams.set('lang', lang);
      window.history.replaceState({}, '', url.pathname + url.search + url.hash);

      // Re-honour a deep link (#cgu / #confidentialite) after the DOM is rebuilt.
      if (window.location.hash) {
        const target = document.getElementById(window.location.hash.slice(1));
        if (target) target.scrollIntoView();
      }
    }

    function buildSwitcher() {
      const el = document.getElementById('langSwitch');
      LANGS.forEach((l) => {
        const btn = document.createElement('button');
        btn.className = 'lang-btn';
        btn.dataset.lang = l;
        btn.textContent = l.toUpperCase();
        btn.onclick = () => render(l);
        el.appendChild(btn);
      });
    }

    buildSwitcher();
    render(getLang());
  </script>
