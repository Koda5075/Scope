# Run `supabase link --project-ref <your-project-ref>` once, then this file
# is used by `supabase db push` / `supabase functions deploy`.
project_id = "scope"

# rso-login and rso-callback are hit via direct browser redirect (no Supabase
# JWT on the request), so JWT verification must stay off for both.
[functions.rso-login]
verify_jwt = false

[functions.rso-callback]
verify_jwt = false

# Same situation as above: no real Supabase session exists yet (RSO isn't wired to a
# real login), so these can't require a JWT either. Revisit once real auth lands —
# both should require a valid session at that point, not stay open indefinitely.
[functions.moderate-avatar]
verify_jwt = false

[functions.report-photo]
verify_jwt = false

# Same situation: no real Supabase session exists yet, so this is called with the
# anon key only. Revisit once real auth lands.
[functions.create-checkout-session]
verify_jwt = false

# Called right after the Stripe redirect, before any session exists — same reasoning.
# Doesn't need a Supabase session to be trustworthy: it re-checks the session id with
# Stripe directly using the secret key, which is the actual source of truth here.
[functions.verify-checkout-session]
verify_jwt = false

# Public read-only Riot proxies (VALORANT platform status / regional leaderboard).
# No session exists yet, and the data is public by nature. Abuse of the daily key's
# rate limit is bounded by the per-region in-function cache (60s / 5min) and the
# APP_URL CORS lock, not by a JWT. Revisit once real auth lands.
[functions.val-status]
verify_jwt = false

[functions.val-leaderboard]
verify_jwt = false
